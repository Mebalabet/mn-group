<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MN Group Admin</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#eef3fb;color:#12213d}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 25px #183b6720}.num{font-size:28px;font-weight:800}.muted{color:#667085;font-size:13px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid #e7ebf2;text-align:left;font-size:14px}button{padding:8px 12px;border:0;border-radius:8px;cursor:pointer}.approve{background:#1e9e6b;color:#fff}.reject{background:#d6415a;color:#fff}.section{margin-top:24px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}table{font-size:12px;display:block;overflow:auto}}</style></head><body><div class="wrap"><div class="top"><div><h1>MN Group Admin</h1><div class="muted">Protected administration</div></div><button onclick="location.href='/'">Back to marketplace</button></div><div id="app" style="margin-top:22px">Loading…</div></div><script>
const token=localStorage.getItem('mn_token');if(!token)location.href='/';
async function api(p,o={}){o.headers=Object.assign({'Content-Type':'application/json',Authorization:'Bearer '+token},o.headers||{});let r=await fetch('/api'+p,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){try{const [me,stats,products,users,orders,quotes,audit,paymentEvents]=await Promise.all([api('/auth/me'),api('/admin/dashboard'),api('/admin/products'),api('/admin/users'),api('/admin/orders'),api('/admin/quotes'),api('/admin/audit'),api('/admin/payment-events')]);if(me.user.role!=='admin')throw Error('Admin access required');document.getElementById('app').innerHTML=`<div class="grid"><div class="card"><div class="num">${stats.users}</div><div class="muted">Users</div></div><div class="card"><div class="num">${stats.products}</div><div class="muted">Products</div></div><div class="card"><div class="num">${stats.pendingProducts}</div><div class="muted">Pending approvals</div></div><div class="card"><div class="num">${stats.orders}</div><div class="muted">Orders</div></div><div class="card"><div class="num">₹${Number(stats.revenue||0).toFixed(2)}</div><div class="muted">Revenue (paid orders, INR)</div></div><div class="card"><div class="num">${stats.pendingPayments||0}</div><div class="muted">Orders awaiting payment</div></div><div class="card"><div class="num">${stats.quotes}</div><div class="muted">Quotes</div></div><div class="card"><div class="num">${Object.entries(stats.quotesByStatus||{}).map(([k,v])=>`${esc(k)}: ${v}`).join(', ')||'—'}</div><div class="muted">Quotes by status</div></div></div>` + `<div class="section card"><h2>Listing approvals</h2><table><thead><tr><th>Name</th><th>Seller</th><th>Status</th><th>Action</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sellerId)}</td><td>${p.status}</td><td>${p.status==='pending'?`<button class="approve" onclick="setStatus('${p.id}','approved')">Approve</button> <button class="reject" onclick="setStatus('${p.id}','rejected')">Reject</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="4">No listings yet.</td></tr>'}</tbody></table></div><div class="section card"><h2>Orders</h2><table><thead><tr><th>Order</th><th>Buyer</th><th>Items</th><th>Total</th><th>Payment</th><th>Placed</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc(o.id.slice(0,8))}</td><td>${esc(o.buyerId.slice(0,8))}</td><td>${o.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</td><td>₹${Number(o.total).toFixed(2)}</td><td>${esc(o.paymentStatus)}</td><td>${new Date(o.createdAt).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="6">No orders yet.</td></tr>'}</tbody></table></div><div class="section card"><h2>Digital files</h2><table><thead><tr><th>Product</th><th>File</th><th>Payhip</th><th>Seller</th><th>Status</th><th>Manage</th></tr></thead><tbody>${products.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.fileName||'—')}</td><td>${p.payhipUrl?`<a href="${esc(p.payhipUrl)}" target="_blank" rel="noopener">Open</a>`:'—'}</td><td>${esc(p.sellerId||'—')}</td><td>${esc(p.status)}</td><td><button onclick="setFile('${p.id}',${JSON.stringify(p.fileName||'')})">File</button> <button onclick="setPayhip('${p.id}',${JSON.stringify(p.payhipUrl||'')})">Payhip</button></td></tr>`).join('')||'<tr><td colspan="6">No products yet.</td></tr>'}</tbody></table></div><div class="section card"><h2>Payment events</h2><table><thead><tr><th>Time</th><th>Provider</th><th>Order</th><th>Status</th><th>Event ref</th></tr></thead><tbody>${paymentEvents.map(e=>`<tr><td>${new Date(e.createdAt).toLocaleString()}</td><td>${esc(e.provider)}</td><td>${esc((e.orderId||'').slice(0,8))}</td><td>${esc(e.status)}</td><td>${esc(e.eventId)}</td></tr>`).join('')||'<tr><td colspan="5">No payment events recorded yet.</td></tr>'}</tbody></table></div><div class="section card"><h2>Users</h2><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role}</td></tr>`).join('')}</tbody></table></div><div class="section card"><h2>Quote requests</h2><table><thead><tr><th>Name</th><th>Company</th><th>Service</th><th>Budget / Timeline</th><th>Details</th><th>Status</th><th>Action</th></tr></thead><tbody>${quotes.map(q=>`<tr><td>${esc(q.name)}<br><span class="muted">${esc(q.email)}</span></td><td>${esc(q.company||'—')}</td><td>${esc(q.serviceLine||'—')}</td><td>${esc(q.budget||'—')} / ${esc(q.timeline||'—')}</td><td>${esc(q.details)}</td><td>${esc(q.status)}</td><td>${quoteActions(q.status,q.id)}<br><button onclick="setQuoteMessage('${q.id}', ${JSON.stringify(q.customerMessage||'')})">Message</button> <button onclick="setQuoteNote('${q.id}', ${JSON.stringify(q.internalNote||'')})">Note</button></td></tr>`).join('')||'<tr><td colspan="7">No requests.</td></tr>'}</tbody></table></div>` + `<div class="section card"><h2>Audit log</h2><table><thead><tr><th>Time</th><th>Action</th><th>Details</th></tr></thead><tbody>${audit.slice(0,30).map(a=>`<tr><td>${new Date(a.createdAt).toLocaleString()}</td><td>${esc(a.action)}</td><td>${esc(JSON.stringify(a.details))}</td></tr>`).join('')}</tbody></table></div>`;}catch(e){document.getElementById('app').innerHTML='<div class="card"><b>'+esc(e.message)+'</b><p>Return to the marketplace and register/login with the admin account.</p></div>';}}
async function setStatus(id,status){await api('/admin/products/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}
async function setFile(id,current){const value=prompt('Enter the uploaded file ID (or leave blank to detach):',current||'');if(value===null)return;await api('/admin/products/'+id,{method:'PATCH',body:JSON.stringify({fileName:value.trim()||null})});load()}
async function setPayhip(id,current){const value=prompt('Paste the Payhip product URL (or leave blank to clear):',current||'');if(value===null)return;await api('/admin/products/'+id,{method:'PATCH',body:JSON.stringify({payhipUrl:value.trim()||null})});load()}
async function setQuoteStatus(id,status){await api('/admin/quotes/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}
async function setQuoteMessage(id,current){const msg=prompt('Message to send to the customer:',current||'');if(msg===null)return;await api('/admin/quotes/'+id,{method:'PATCH',body:JSON.stringify({customerMessage:msg})});load()}
async function setQuoteNote(id,current){const note=prompt('Internal note (never shown to the customer):',current||'');if(note===null)return;await api('/admin/quotes/'+id,{method:'PATCH',body:JSON.stringify({internalNote:note})});load()}
// Mirrors the allowed transitions in quoteState.js — kept in sync manually
// since this is a separate (browser) runtime from server.js.
const QUOTE_NEXT={new:[['reviewing','Start review'],['declined','Decline']],reviewing:[['quoted','Send quote'],['declined','Decline']],quoted:[['accepted','Mark accepted'],['declined','Decline']],accepted:[['closed','Close']],declined:[],closed:[]};
function quoteActions(status,id){return (QUOTE_NEXT[status]||[]).map(([next,label])=>`<button onclick="setQuoteStatus('${id}','${next}')">${label}</button>`).join(' ')||'—'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}load();</script></body></html>
