<div class="topstrip">
  <div class="wrap">
    <div class="left"><span>📞 +1 (415) 555-0148</span><span>✉ hello@ledgermarket.com</span></div>
    <div class="right"><span>🌐 Buyers worldwide</span><a href="#" onclick="return openSell(event)">Sell your work</a></div>
  </div>
</div>

<header>
  <div class="mainbar">
    <div class="wrap">
      <a href="/" class="wordmark">
        <span class="badge">M</span>
        <span class="txt"><span class="mark">MN Group</span><br><span class="tag">DIGITAL MARKET</span></span>
      </a>
      <div class="top-actions" style="margin-left:auto;">
        <button class="icon-btn" aria-label="Search" onclick="toggleSearch()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </button>
        <button class="icon-btn" aria-label="Open cart" onclick="openCart()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 2-1.6L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg>
          <span class="cart-count" id="cartCount" style="display:none">0</span>
        </button>
        <button class="auth-btn" onclick="openAuth('login')">Login</button>
        <button class="auth-btn solid" onclick="openAuth('register')">Register</button>
        <button class="sell-btn" onclick="openSell()">Sell</button>
      </div>
    </div>
    <div class="wrap mainbar-sub">
      <nav class="subnav">
        <a href="/" data-nav="home">Home</a>
        <a href="/products" data-nav="products">Products</a>
        <a href="/categories" data-nav="categories">Categories</a>
        <a href="#" onclick="return openSell(event)">Sellers</a>
        <a href="#" onclick="return openServiceDetail(event, null)">Services</a>
        <a href="/#about">About us</a>
        <a href="/#about">Contact</a>
      </nav>
      <div class="search-row" id="searchRow"><input type="text" id="searchInput" placeholder="Search products, e.g. 'invoice template' or 'React'" oninput="if(typeof renderGrid==='function') renderGrid();"></div>
    </div>
  </div>
</header>
