<div class="scrim" id="scrim" onclick="closeAllOverlays()"></div>
<div class="drawer" id="cartDrawer" aria-hidden="true">
  <div class="drawer-head"><h2>Your cart</h2><button class="drawer-close" onclick="closeAllOverlays()" aria-label="Close cart">✕</button></div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot" style="display:none">
    <div class="subtotal-row"><span>Subtotal</span><span id="cartSubtotal" class="mono"></span></div>
    <div class="total-row"><span>Total</span><span id="cartTotal" class="mono"></span></div>
    <button class="checkout-btn" id="checkoutBtn" onclick="openCheckout()">Checkout</button>
  </div>
</div>

<div class="modal-center" id="authModal" onclick="closeOnBackdrop(event)"><div class="modal-box" style="position:relative;"><button class="modal-close-x" onclick="closeAllOverlays()" aria-label="Close">✕</button><div class="modal-drag"></div><div class="modal-inner" id="authContent"></div></div></div>
<div class="modal-center" id="pdModal" onclick="closeOnBackdrop(event)"><div class="modal-box" style="position:relative;"><button class="modal-close-x" onclick="closeAllOverlays()" aria-label="Close">✕</button><div id="pdContent"></div></div></div>
<div class="modal-center" id="checkoutModal" onclick="closeOnBackdrop(event)"><div class="modal-box" style="position:relative;"><button class="modal-close-x" onclick="closeAllOverlays()" aria-label="Close">✕</button><div class="modal-drag"></div><div class="steps"><div class="step-dot active" id="stepDot1"></div><div class="step-dot" id="stepDot2"></div></div><div class="modal-inner" id="checkoutContent"></div></div></div>
<div class="modal-center" id="sellModal" onclick="closeOnBackdrop(event)"><div class="modal-box" style="position:relative;"><button class="modal-close-x" onclick="closeAllOverlays()" aria-label="Close">✕</button><div class="modal-drag"></div><div class="modal-inner" id="sellContent"></div></div></div>
<div class="modal-center" id="ordersModal" onclick="closeOnBackdrop(event)"><div class="modal-box" style="position:relative;"><button class="modal-close-x" onclick="closeAllOverlays()" aria-label="Close">✕</button><div class="modal-drag"></div><div class="modal-inner" id="ordersContent"></div></div></div>

<div class="toast" id="toast"></div>

<button class="whatsapp-fab" onclick="location.href='/#about'" aria-label="Open support information">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.79.47 3.47 1.29 4.93L2 22l5.29-1.39c1.41.77 3.02 1.21 4.75 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.5 14.13c-.23.65-1.36 1.24-1.87 1.29-.5.05-1.01.24-3.39-.7-2.87-1.14-4.72-4.04-4.86-4.23-.14-.19-1.16-1.54-1.16-2.94s.72-2.09.97-2.37c.25-.28.55-.35.73-.35h.53c.17 0 .4-.03.61.47.23.55.77 1.9.84 2.04.07.14.11.3.02.48-.09.19-.14.3-.28.46-.14.16-.29.36-.42.48-.14.13-.28.28-.12.55.16.28.7 1.16 1.51 1.88 1.04.93 1.92 1.22 2.19 1.36.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.28.37-.23.62-.14.25.09 1.6.75 1.87.89.28.14.46.21.53.32.07.12.07.68-.16 1.33z"/></svg>
  <span class="lbl">Chat on WhatsApp</span>
</button>

<button class="ai-fab" id="aiFabBtn" onclick="toggleAiPanel()" aria-label="Ask MN Group AI">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M9 13v2M15 13v2"/></svg>
  <span class="lbl">Ask MN Group AI</span>
</button>
<div class="ai-panel" id="aiPanel">
  <div class="ai-panel-head">
    <h4>Ask MN Group AI <span class="ai-badge">AI</span></h4>
    <button class="ai-panel-close" onclick="toggleAiPanel()" aria-label="Close">✕</button>
  </div>
  <div class="ai-panel-body" id="aiPanelBody"></div>
  <div class="ai-panel-foot">
    <input type="text" id="aiInput" placeholder="Ask about products, pricing, services…" onkeydown="if(event.key==='Enter') sendAiMessage();">
    <button id="aiSendBtn" onclick="sendAiMessage()">Send</button>
  </div>
</div>
